name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Sessie permissies instellen voor de GITHUB_TOKEN
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint
        
      - name: Type Check
        run: npm run type-check

      - name: Tests
        run: npm run test

      - name: Build
        # Belangrijk: De Vite app is geconfigureerd met base: "/repo-naam/",
        # Voor lokale test is het \`/\`, maar de CLI build zorgt dat dit goed meekomt uit \`vite.config.ts\` of \`npm run build\` met de juiste VITE_BASE arg als je dat wil overriden.
        # Check vite.config.ts base setting voor het juiste pad.
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Vite compileert default naar "dist"
          path: './dist'
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
